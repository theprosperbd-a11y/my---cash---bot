<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cash Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11375484' data-sdk='show_11375484'></script>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f2937;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    text-align:center;
}
button{
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:10px;
    background:#0099ff;
    color:white;
}
</style>
</head>

<body>

<div class="container">
<p id="balance">Balance: 0</p>
<h1>Welcome to My Cash Bot</h1>
<p>Telegram Mini App Ready!</p>
<button onclick="startReward()">Start</button>
</div>

<script>

    const API_URL = "https://script.google.com/macros/s/AKfycbz5iVhB-b0kDLlDCshkTdWRENjTBLyPOG3Xjvo2GMf3pvImzNHiGtGNhNiUA5yoa6AwLw/exec";

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
fetch(API_URL + "?userId=" + tg.initDataUnsafe.user.id)
  .then(res => res.json())
  .then(data => {
    document.getElementById("balance").innerText =
      "Balance: " + data.balance;
  });
// alert(JSON.stringify(tg.initDataUnsafe));

async function startReward(){
alert("Start button clicked");
   alert(JSON.stringify(tg.initDataUnsafe));
const user = tg.initDataUnsafe.user; 
    alert("User OK");

    if(!user){
        alert("Telegram User পাওয়া যায়নি!");
        return;
    }

// await show_11375484();

alert("Sending request...");

try {
  const res = await fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    userId: user.id,
    name: user.first_name,
    amount: 1
  })
});


    const text = await res.text();
alert(text);
    

      
      
      
    
  

  alert("Reward Added!");
} catch (e) {
  alert("ERROR: " + e.message);
}





}
</script>
</body>
</html>
