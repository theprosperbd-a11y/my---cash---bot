<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Cash Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="11375484" data-sdk="show_11375484"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#123b31 0,transparent 32%),linear-gradient(180deg,#06101d,#091728 55%,#07111f)}.app{max-width:520px;min-height:100vh;margin:auto;padding:25px 18px 30px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#35f58b,#0a8b4e);font-size:24px;font-weight:bold;box-shadow:0 0 25px #20df7955}.brand h1{font-size:20px;margin:0}.brand p{font-size:11px;color:#91a4bd;margin:4px 0}.status{font-size:11px;font-weight:bold;color:#20df79;background:#20df7918;border:1px solid #20df7933;padding:7px 10px;border-radius:20px}.hero{text-align:center;margin:30px 0 25px}.coin{width:90px;height:90px;margin:auto auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;background:radial-gradient(circle at 35% 30%,#62ffa5,#14a85e 60%,#07663a);border:5px solid #74ffad88;box-shadow:0 0 0 9px #20df7912,0 0 40px #20df794d}.hero h2{font-size:29px;margin:0 0 7px}.hero h2 span{color:#20df79}.hero p{color:#91a4bd;font-size:14px;margin:0}.balance{position:relative;overflow:hidden;background:linear-gradient(145deg,#12243cf5,#0a192bf5);border:1px solid #668bb433;border-radius:24px;padding:24px;box-shadow:0 18px 45px #0004}.label{font-size:12px;letter-spacing:1.5px;color:#91a4bd;font-weight:bold}.amount{font-size:50px;font-weight:800;margin:7px 0}.coins{display:inline-block;color:#20df79;background:#20df7914;border:1px solid #20df7933;padding:7px 13px;border-radius:20px;font-size:13px;font-weight:bold}.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;background:#0e1c30e8;border:1px solid #668bb42e;border-radius:20px;overflow:hidden}.stat{padding:18px 16px}.stat+ .stat{border-left:1px solid #668bb42e}.stat small{display:block;color:#91a4bd;font-size:10px;text-transform:uppercase;letter-spacing:.7px}.stat strong{display:block;color:#20df79;font-size:20px;margin-top:6px}.action{margin-top:17px}button{width:100%;padding:17px;border:0;border-radius:18px;font-size:18px;font-weight:800;color:#062015;background:linear-gradient(135deg,#2af184,#12c66a);box-shadow:0 10px 30px #20df7940}button:disabled{opacity:.55;box-shadow:none}.hint{text-align:center;color:#91a4bd;font-size:12px;margin:10px}.hint b{color:#20df79}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.feature{padding:15px 7px;text-align:center;background:#0e1c30d9;border:1px solid #668bb42e;border-radius:16px}.feature .icon{font-size:20px;margin-bottom:6px}.feature strong{display:block;font-size:11px}.feature span{display:block;color:#91a4bd;font-size:9px;margin-top:4px}.footer{text-align:center;color:#60748e;font-size:10px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand"><div class="logo">$</div><div><h1>My Cash Bot</h1><p>Reward dashboard</p></div></div><div class="status">● ONLINE</div></div>
<div class="hero"><div class="coin">$</div><h2>Welcome <span id="userName">Back!</span> 👋</h2><p>Watch ads and collect coins</p></div>
<div class="balance"><div class="label">YOUR BALANCE</div><div class="amount" id="balance">0</div><div class="coins">🪙 Coins</div></div>
<div class="stats"><div class="stat"><small>Total Earned</small><strong id="earned">0</strong></div><div class="stat"><small>Reward Status</small><strong id="rewardStatus">Ready</strong></div></div>
<div class="action"><button id="rewardBtn" onclick="startReward()">▶ Watch Reward Ad</button><div class="hint">Watch an ad and earn <b>+1 coin</b></div></div>
<div class="features"><div class="feature"><div class="icon">🛡️</div><strong>Secure</strong><span>Protected</span></div><div class="feature"><div class="icon">🎁</div><strong>Rewards</strong><span>Earn coins</span></div><div class="feature"><div class="icon">⚡</div><strong>Instant</strong><span>Live balance</span></div></div>
<div class="footer">My Cash Bot • Reward System</div>
</div>
<script>
const tg=window.Telegram.WebApp;tg.expand();const user=tg.initDataUnsafe&&tg.initDataUnsafe.user;
const API_URL="https://script.google.com/macros/s/AKfycbz5iVhB-b0kDLlDCshkTdWRENjTBLyPOG3Xjvo2GMf3pvImzNHiGtGNhNiUA5yoa6AwLw/exec";
let timer=null;
function showMessage(m){if(tg&&tg.showAlert)tg.showAlert(m);else alert(m)}
function setBalance(v){v=Number(v||0);document.getElementById("balance").innerText=v;document.getElementById("earned").innerText=v}
async function loadBalance(){if(!user||!user.id)return;document.getElementById("userName").innerText=user.first_name||"Back!";try{const r=await fetch(API_URL+"?userId="+encodeURIComponent(user.id)+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();if(!d.success)throw Error(d.error||"Balance fetch failed");setBalance(d.balance)}catch(e){console.error(e)}}
function cooldown(sec){clearInterval(timer);const b=document.getElementById("rewardBtn"),s=document.getElementById("rewardStatus");let n=Number(sec);b.disabled=true;s.innerText=n+"s";b.innerText="Please wait "+n+"s";timer=setInterval(()=>{n--;if(n<=0){clearInterval(timer);b.disabled=false;b.innerText="▶ Watch Reward Ad";s.innerText="Ready"}else{s.innerText=n+"s";b.innerText="Please wait "+n+"s"}},1000)}
async function startReward(){if(!user||!user.id){showMessage("Telegram user information not found.");return}const b=document.getElementById("rewardBtn"),s=document.getElementById("rewardStatus");b.disabled=true;b.innerText="Loading Ad...";s.innerText="Loading";try{await show_11375484();b.innerText="Adding Reward...";const u=API_URL+"?action=reward&userId="+encodeURIComponent(user.id)+"&name="+encodeURIComponent(user.first_name||"User")+"&_="+Date.now();const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();setBalance(d.balance);if(!d.success){showMessage(d.error||"Reward was not added.");const m=String(d.error||"").match(/(\d+)\s*seconds?/i);m?cooldown(m[1]):(b.disabled=false,b.innerText="▶ Watch Reward Ad",s.innerText="Ready");return}showMessage("Reward added successfully!\n+"+Number(d.amount||1)+" coin");cooldown(30)}catch(e){console.error(e);b.disabled=false;b.innerText="▶ Watch Reward Ad";s.innerText="Ready";showMessage("Something went wrong.\n\n"+e.message)}}
loadBalance();
</script>
</body>
</html>
