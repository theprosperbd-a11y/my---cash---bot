<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Earnnest Bot</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="//libtl.com/sdk.js" data-zone="11375484" data-sdk="show_11375484"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b1222;color:#fff;font-family:Arial,sans-serif;padding-bottom:82px}.app{max-width:560px;margin:auto;min-height:100vh}.header{text-align:center;padding:25px 15px 20px;background:#202a3a;border-bottom:4px solid #20d467}.logo{font-size:34px;font-weight:800;color:#20d467}.welcome{font-size:25px;margin-top:18px}.uid{font-size:17px;color:#aeb7c5;margin-top:6px}.main{padding:30px 22px}.card,.tasks{background:#202a3a;border-radius:28px;padding:28px 18px;text-align:center}.title{font-size:40px;font-weight:800}.balance{font-size:58px;color:#20d467;font-weight:800;margin-top:18px}.coins{font-size:24px;color:#20d467}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}button{border:0;border-radius:22px;background:#20c963;color:white;font-size:20px;min-height:82px;font-weight:600;padding:12px}button:disabled{opacity:.55}.tasks{margin-top:28px;text-align:left}.tasks h2{margin:0;color:#20d467;font-size:34px}.tasks p{color:#aeb7c5}.nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:#202a3a;border-top:1px solid #394456;display:flex;justify-content:space-around;align-items:center}.nav div{font-size:17px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;padding:20px;align-items:center;justify-content:center}.modalBox{width:100%;max-width:500px;background:#202a3a;border-radius:24px;padding:25px}.modalBox h2{color:#20d467;margin-top:0}.method{display:grid;grid-template-columns:1fr 1fr;gap:10px}.method button{min-height:58px;font-size:17px}.method button.selected{outline:3px solid #fff}.input{width:100%;padding:14px;border-radius:12px;border:0;margin:9px 0;font-size:17px}.small{color:#aeb7c5;font-size:14px}.close{background:#475569;margin-top:10px;width:100%}.refLink{background:#0b1222;border-radius:12px;padding:12px;word-break:break-all;margin:12px 0;color:#20d467}.copy{min-height:52px;width:100%;font-size:17px}</style></head><body><div class="app"><header class="header"><div class="logo">💰 Earnnest Bot</div><div class="welcome">Welcome, <span id="userName">User</span></div><div class="uid">User ID: <span id="userId">—</span></div></header><main class="main"><div class="card"><div class="title">Balance</div><div><span id="balance" class="balance">0</span> <span class="coins">Coins</span></div></div><div class="grid"><button id="dailyBtn" onclick="dailyBonus()">🎁 Daily Bonus</button><button id="rewardBtn" onclick="startReward()">▶ Watch Ads</button><button onclick="openDeposit()">💵 Deposit</button><button onclick="coming('Withdraw')">💸 Withdraw</button><button onclick="openReferral()">👥 Referral</button></div><div class="tasks"><h2>Tasks</h2><p>Complete tasks and earn more coins.</p></div></main><nav class="nav"><div>🏠 Home</div><div onclick="startReward()">💰 Earn</div><div onclick="openDeposit()">💵 Deposit</div><div onclick="coming('Profile')">👤 Profile</div></nav></div><div class="modal" id="depositModal"><div class="modalBox"><h2>💵 Deposit</h2><div class="small">Minimum ৳100 • Maximum ৳5000</div><div class="method" id="methods"></div><div id="accountBox" class="small" style="margin:15px 0"></div><input id="depAmount" class="input" type="number" min="100" max="5000" placeholder="Amount (100 - 5000)"><input id="depTxid" class="input" type="text" placeholder="Transaction ID"><button id="depSubmit" onclick="submitDeposit()">Submit Deposit</button><button class="close" onclick="closeDeposit()">Close</button></div></div><div class="modal" id="referralModal"><div class="modalBox"><h2>👥 Referral</h2><div class="small">Your referral link:</div><div id="refLink" class="refLink">Loading...</div><div id="refStats" class="small"></div><button class="copy" onclick="copyReferral()">📋 Copy Referral Link</button><button class="close" onclick="closeReferral()">Close</button></div></div><script>const tg=window.Telegram.WebApp;tg.expand();const user=tg.initDataUnsafe&&tg.initDataUnsafe.user;const API_URL="https://script.google.com/macros/s/AKfycbz5iVhB-b0kDLlDCshkTdWRENjTBLyPOG3Xjvo2GMf3pvImzNHiGtGNhNiUA5yoa6AwLw/exec";let methods={},selectedMethod="",referralLink="";function msg(x){if(tg&&tg.showAlert)tg.showAlert(String(x));else alert(x)}function setBalance(x){document.getElementById("balance").innerText=Number(x||0)}async function api(p){const u=new URL(API_URL);Object.keys(p).forEach(k=>u.searchParams.set(k,p[k]));u.searchParams.set("_",Date.now());return(await fetch(u.toString(),{cache:"no-store"})).json()}async function loadBalance(){if(!user)return;document.getElementById("userName").innerText=user.first_name||"User";document.getElementById("userId").innerText=user.id;try{let d=await api({userId:user.id});if(d.success)setBalance(d.balance)}catch(e){console.log(e)}}async function dailyBonus(){const b=document.getElementById("dailyBtn");b.disabled=true;try{let d=await api({action:"daily_bonus",userId:user.id,name:user.first_name||"User"});if(d.balance!==undefined)setBalance(d.balance);msg(d.success?"🎉 Daily Bonus +"+d.amount+" Coins":d.error||"Error");b.innerText=d.success?"✓ Bonus Claimed":"🎁 Daily Bonus"}catch(e){b.disabled=false;b.innerText="🎁 Daily Bonus";msg("Error: "+e.message)}}async function startReward(){const b=document.getElementById("rewardBtn");b.disabled=true;try{if(typeof show_11375484==="function")await show_11375484();let d=await api({action:"reward",userId:user.id,name:user.first_name||"User"});if(d.balance!==undefined)setBalance(d.balance);msg(d.success?"🎉 +"+d.amount+" Coin":d.error||"Error")}catch(e){msg("Fetch error: "+e.message)}finally{b.disabled=false}}async function openDeposit(){document.getElementById("depositModal").style.display="flex";try{let d=await api({action:"payment_methods"});if(!d.success)throw Error(d.error);methods=d.methods||{};renderMethods()}catch(e){msg("Could not load payment methods: "+e.message)}}function renderMethods(){const box=document.getElementById("methods");box.innerHTML="";Object.keys(methods).forEach(m=>{let b=document.createElement("button");b.innerText=m;b.onclick=()=>selectMethod(m,b);box.appendChild(b)});if(!Object.keys(methods).length)box.innerHTML="<div class='small'>No payment method is active.</div>"}function selectMethod(m,b){selectedMethod=m;document.querySelectorAll(".method button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");document.getElementById("accountBox").innerText="Send payment to: "+methods[m]}async function submitDeposit(){if(!selectedMethod)return msg("Select a payment method.");const amount=Number(document.getElementById("depAmount").value),tx=document.getElementById("depTxid").value.trim();if(amount<100||amount>5000)return msg("Amount must be between ৳100 and ৳5000.");if(!tx)return msg("Enter Transaction ID.");const b=document.getElementById("depSubmit");b.disabled=true;try{let d=await api({action:"deposit",userId:user.id,name:user.first_name||"User",method:selectedMethod,amount,txid:tx});msg(d.success?"✅ Deposit request submitted.\nStatus: PENDING":"❌ "+(d.error||"Deposit failed"));if(d.success){document.getElementById("depAmount").value="";document.getElementById("depTxid").value="";closeDeposit()}}catch(e){msg("Deposit error: "+e.message)}finally{b.disabled=false}}function closeDeposit(){document.getElementById("depositModal").style.display="none"}async function openReferral(){if(!user||!user.id)return msg("Telegram user information not found.");document.getElementById("referralModal").style.display="flex";try{let d=await api({action:"referral_info",userId:user.id});if(!d.success)throw Error(d.error||"Could not load referral info.");referralLink=d.referralLink||"";document.getElementById("refLink").innerText=referralLink||"Set BOT_USERNAME in Apps Script properties.";document.getElementById("refStats").innerText="Your referral earnings: "+(d.referralBalance||0)+" Coins\nYou earn: "+d.referrerBonus+" Coins per successful referral."}catch(e){document.getElementById("refLink").innerText="Error: "+e.message}}async function copyReferral(){if(!referralLink)return msg("Referral link is not available.");try{await navigator.clipboard.writeText(referralLink);msg("✅ Referral link copied.")}catch(e){msg(referralLink)}}function closeReferral(){document.getElementById("referralModal").style.display="none"}function coming(x){msg(x+" feature is coming soon.")}loadBalance();</script></body></html>
