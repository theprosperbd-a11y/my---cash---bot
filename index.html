<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cash Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="11375484" data-sdk="show_11375484"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f2937;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    text-align:center;
}
button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:#fff;
}
</style>
</head>
<body>

<div class="container">
    <h2>My Cash Bot</h2>
    <p id="balance">Balance: 0</p>
    <button onclick="startReward()">Watch Reward Ad</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;

// নতুন Apps Script URL
const API_URL = "https://script.google.com/macros/s/AKfycbz5iVhB-b0kDLlDCshkTdWRENjTBLyPOG3Xjvo2GMf3pvImzNHiGtGNhNiUA5yoa6AwLw/exec";

// ব্যালেন্স লোড
function loadBalance(){
    if(!user) return;

    fetch(API_URL + "?userId=" + user.id)
    .then(r=>r.json())
    .then(data=>{
        document.getElementById("balance").innerText =
        "Balance: " + data.balance;
    });
}
    
// Reward Ad
function startReward(){

    alert("Start");

    show_11375484().then(()=>{

        alert("Ad Completed");

        fetch(API_URL,{
    method:"POST",
    mode:"cors",
    headers:{
        "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify({
        userId:user.id,
        name:user.first_name,
        amount:1
    })
})
        .then(r=>r.json())
        .then(data=>{
            alert("POST Success");
            loadBalance();
        })
        .catch(err=>{
            alert("POST Error: " + err);
        });

    }).catch(()=>{
        alert("Ad was not completed.");
    });

}
loadBalance();

</script>

</body>
</html>
