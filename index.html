<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Earnnest Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="11375484" data-sdk="show_11375484"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#0b1222;color:#fff}body{padding-bottom:78px}.app{width:100%;max-width:560px;margin:auto;min-height:100vh;background:#0b1222}.header{text-align:center;padding:27px 18px 20px;background:#202a3a;border-bottom:4px solid #20d467}.logoTitle{font-size:35px;font-weight:800;color:#20d467}.welcome{font-size:27px;color:#d7dce5;margin-top:20px}.userId{font-size:20px;color:#aeb7c5;margin-top:7px}.main{padding:42px 34px 28px}.balanceCard{background:#202a3a;border-radius:30px;padding:43px 20px 46px;text-align:center}.balanceTitle{font-size:45px;font-weight:800;margin-bottom:28px}.balanceValue{font-size:60px;font-weight:800;color:#20d467}.balanceUnit{font-size:28px;color:#20d467;font-weight:700;margin-left:5px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:43px}.menuBtn{min-height:108px;border:0;border-radius:27px;background:#20c963;color:#fff;font-size:28px;font-weight:500;padding:12px 8px}.menuBtn:active{transform:scale(.98)}.menuBtn:disabled{opacity:.55}.tasks{margin-top:42px;background:#202a3a;border-radius:30px;padding:38px;min-height:180px}.tasks h2{margin:0;color:#20d467;font-size:45px}.tasks p{color:#aeb7c5;font-size:18px;margin-top:12px}.bottomNav{position:fixed;left:0;right:0;bottom:0;height:78px;background:#202a3a;border-top:1px solid #394456;display:flex;justify-content:space-around;align-items:center;z-index:10}.navItem{font-size:22px;color:#fff;text-align:center;min-width:24%;white-space:nowrap}@media(max-width:390px){.logoTitle{font-size:29px}.welcome{font-size:23px}.userId{font-size:17px}.main{padding:30px 18px 24px}.balanceTitle{font-size:38px}.balanceValue{font-size:52px}.buttons{gap:16px}.menuBtn{font-size:22px;min-height:90px}.tasks h2{font-size:38px}.navItem{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="logoTitle">💰 Earnnest Bot</div>
<div class="welcome">Welcome, <span id="userName">User</span></div>
<div class="userId">User ID: <span id="userId">—</span></div>
</header>

<main class="main">
<section class="balanceCard">
<div class="balanceTitle">Balance</div>
<div><span id="balance" class="balanceValue">0</span><span class="balanceUnit">Coins</span></div>
</section>

<section class="buttons">
<button class="menuBtn" id="dailyBtn" onclick="dailyBonus()">🎁 Daily Bonus</button>
<button class="menuBtn" id="rewardBtn" onclick="startReward()">▶ Watch Ads</button>
<button class="menuBtn" onclick="showComing('Referral')">👥 Referral</button>
<button class="menuBtn" onclick="showComing('Deposit')">💵 Deposit</button>
<button class="menuBtn" onclick="showComing('Withdraw')">💸 Withdraw</button>
</section>

<section class="tasks">
<h2>Tasks</h2>
<p>Complete tasks and earn more coins.</p>
</section>
</main>

<nav class="bottomNav">
<div class="navItem">🏠 Home</div>
<div class="navItem" onclick="startReward()">💰 Earn</div>
<div class="navItem" onclick="showComing('Referral')">👥 Referral</div>
<div class="navItem" onclick="showComing('Profile')">👤 Profile</div>
</nav>
</div>

<script>
const tg=window.Telegram.WebApp;
tg.expand();
const user=tg.initDataUnsafe&&tg.initDataUnsafe.user;
const API_URL="https://script.google.com/macros/s/AKfycbz5iVhB-b0kDLlDCshkTdWRENjTBLyPOG3Xjvo2GMf3pvImzNHiGtGNhNiUA5yoa6AwLw/exec";
let cooldownTimer=null;

function msg(text){if(tg&&tg.showAlert)tg.showAlert(text);else alert(text)}
function setBalance(v){document.getElementById("balance").innerText=Number(v||0)}

async function loadBalance(){
 if(!user||!user.id)return;
 document.getElementById("userName").innerText=user.first_name||"User";
 document.getElementById("userId").innerText=String(user.id);
 try{
  const r=await fetch(API_URL+"?userId="+encodeURIComponent(user.id)+"&_="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw Error("HTTP "+r.status);
  const d=await r.json();
  if(!d.success)throw Error(d.error||"Balance fetch failed");
  setBalance(d.balance);
 }catch(e){console.error(e)}
}

function startCooldown(seconds){
 clearInterval(cooldownTimer);
 const btn=document.getElementById("rewardBtn");
 let left=Number(seconds)||30;
 btn.disabled=true;btn.innerText="Please wait "+left+"s";
 cooldownTimer=setInterval(()=>{
  left--;
  if(left<=0){clearInterval(cooldownTimer);btn.disabled=false;btn.innerText="▶ Watch Ads"}
  else btn.innerText="Please wait "+left+"s";
 },1000);
}

async function startReward(){
 if(!user||!user.id){msg("Telegram user information not found.");return}
 const btn=document.getElementById("rewardBtn");
 btn.disabled=true;btn.innerText="Loading Ad...";
 try{
  await show_11375484();
  btn.innerText="Adding Reward...";
  const url=API_URL+"?action=reward&userId="+encodeURIComponent(user.id)+"&name="+encodeURIComponent(user.first_name||"User")+"&_="+Date.now();
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw Error("HTTP "+r.status);
  const d=await r.json();
  if(d.balance!==undefined)setBalance(d.balance);
  if(!d.success){
   msg(d.error||"Reward was not added.");
   const m=String(d.error||"").match(/(\d+)\s*seconds?/i);
   if(m)startCooldown(Number(m[1]));else{btn.disabled=false;btn.innerText="▶ Watch Ads"}
   return;
  }
  msg("Reward added successfully!\n+"+Number(d.amount||1)+" Coin");
  startCooldown(30);
 }catch(e){
  console.error(e);btn.disabled=false;btn.innerText="▶ Watch Ads";msg("Fetch error.\n\n"+e.message)
 }
}

async function dailyBonus(){
 if(!user||!user.id){msg("Telegram user information not found.");return}
 const btn=document.getElementById("dailyBtn");
 btn.disabled=true;btn.innerText="Checking...";
 try{
  const url=API_URL+"?action=daily_bonus&userId="+encodeURIComponent(user.id)+"&name="+encodeURIComponent(user.first_name||"User")+"&_="+Date.now();
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw Error("HTTP "+r.status);
  const d=await r.json();
  if(d.balance!==undefined)setBalance(d.balance);

  if(!d.success){
   msg(d.error||"Daily Bonus is not available.");
   btn.disabled=false;btn.innerText="🎁 Daily Bonus";
   return;
  }

  msg("Daily Bonus claimed! 🎉\n+"+Number(d.amount||5)+" Coins");
  btn.innerText="✓ Bonus Claimed";
 }catch(e){
  console.error(e);
  btn.disabled=false;btn.innerText="🎁 Daily Bonus";
  msg("Daily Bonus error.\n\n"+e.message);
 }
}

function showComing(name){msg(name+" feature is coming soon.")}
loadBalance();
</script>
</body>
</html>
